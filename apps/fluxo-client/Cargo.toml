[package]
name = "fluxo-client"
description = "Cliente do Fluxo: recebe por UDP, decodifica na GPU e mostra numa janela."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fluxo-net = { workspace = true }
fluxo-decode = { workspace = true }
fluxo-audio = { workspace = true }

# O cliente portátil (Linux). Opcional: no Windows não pesa no executável normal,
# e no Linux o `fluxo-bench` segue compilando sem C++.
openh264 = { version = "0.9", optional = true }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }

[features]
portatil = ["dep:openh264", "dep:eframe"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
# Tipo da posição do texto no Direct2D (`DrawTextLayout`); já vem com o `windows`.
windows-numerics = "0.2"
