[package]
name = "fluxo"
description = "Janela do Fluxo: compartilhar a tela ou assistir, sem terminal (roda o fluxo-host e o fluxo-client por baixo)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Só para conferir os códigos colados antes de mandar ao host/cliente.
fluxo-net = { workspace = true }
# A lista de monitores (fora do Windows, vazia).
fluxo-capture = { workspace = true }
# A janela: egui com OpenGL (glow).
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"] }

# As saídas de som, para escolher nas configurações (só existe no Windows).
[target.'cfg(windows)'.dependencies]
fluxo-audio = { workspace = true }
# Esconder a janela enquanto o vídeo de quem assiste ocupa o lugar dela, e
# trazê-la de volta quando ele fecha (por HWND, de qualquer thread).
windows = { workspace = true }
raw-window-handle = "0.6"
