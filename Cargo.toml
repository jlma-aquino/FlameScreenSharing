# Workspace do Fluxo — streaming de tela P2P de baixa latência.
#
# Cada pasta em `crates/` é uma biblioteca com uma responsabilidade única.
# Cada pasta em `apps/` é um executável que junta as bibliotecas.
# Veja docs/ARQUITETURA.md para o desenho completo.

[workspace]
resolver = "2"
members = [
    "crates/fluxo-proto",
    "crates/fluxo-capture",
    "crates/fluxo-encode",
    "crates/fluxo-crypto",
    "crates/fluxo-net",
    "crates/fluxo-decode",
    "crates/fluxo-audio",
    "apps/fluxo-bench",
    "apps/fluxo-host",
    "apps/fluxo-client",
    "apps/fluxo-sinal",
    "apps/fluxo",
    "apps/fss-assinatura",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

# Versões de dependências compartilhadas ficam aqui, num lugar só.
[workspace.dependencies]
fluxo-proto = { path = "crates/fluxo-proto" }
fluxo-capture = { path = "crates/fluxo-capture" }
fluxo-encode = { path = "crates/fluxo-encode" }
fluxo-crypto = { path = "crates/fluxo-crypto" }
fluxo-net = { path = "crates/fluxo-net" }
fluxo-decode = { path = "crates/fluxo-decode" }
fluxo-audio = { path = "crates/fluxo-audio" }

windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # Necessário para IDXGIOutput::GetDesc (DXGI_OUTPUT_DESC contém um HMONITOR).
    "Win32_Graphics_Gdi",
    # fluxo-encode: Media Foundation, COM, VARIANT (ICodecAPI) e LoadLibrary (NVENC).
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    # fluxo-audio: WASAPI (captura do que o PC toca e reprodução).
    "Win32_Media_Audio",
    "Win32_System_Com_StructuredStorage",
    "Win32_Media_Audio_Endpoints",
    "Win32_UI_Shell_PropertiesSystem",
    # fluxo-client: painel de estatísticas (Direct2D + DirectWrite).
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    # fluxo-client: janela Win32 e teclado.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # fluxo-capture: captura de uma janela (Windows.Graphics.Capture).
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
    "Win32_Graphics_Dwm",
] }

[profile.release]
# Otimização máxima: o caminho de vídeo é sensível a desempenho.
lto = "thin"
codegen-units = 1
# Mantém nomes de função em stack traces sem pesar o binário.
debug = "line-tables-only"
