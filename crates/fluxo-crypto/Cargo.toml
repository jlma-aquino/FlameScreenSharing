[package]
name = "fluxo-crypto"
description = "Segurança do Fluxo: código de pareamento, handshake SPAKE2 e cifra ChaCha20-Poly1305 dos pacotes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Só bibliotecas de criptografia prontas e auditadas (RustCrypto); nenhum
# algoritmo escrito à mão. Lógica pura: roda e é testado em qualquer sistema.
[dependencies]
chacha20poly1305 = "0.10"
spake2 = "0.4"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
