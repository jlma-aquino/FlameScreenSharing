[package]
name = "fluxo-decode"
description = "Decoder de vídeo (H.264, HEVC, AV1) do Fluxo: Media Foundation com aceleração D3D11 (DXVA), saída em textura na GPU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Só o tipo VideoCodec (crate sem dependências).
fluxo-proto = { workspace = true }

# Os tipos de erro compilam em qualquer sistema; o decoder só no Windows.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
